<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6f5c">
<title>Семейный бюджет</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mute:#76726a;--line:#e7e4dd;
  --acc:#1f6f5c;--acc-ink:#fff;--exp:#c2410c;--inc:#1f6f5c;--chip:#efece5;
  --pd:#2f5fa7;--pa:#b4457a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1e1d1b;--ink:#f1efe9;--mute:#9a958a;--line:#2e2c29;
  --acc:#3fb596;--acc-ink:#0d1f1a;--exp:#f08a5d;--inc:#3fb596;--chip:#2a2825;
  --pd:#7aa6e8;--pa:#e58ab8}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.tabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px;position:sticky;top:0;z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:11px 6px;border-radius:11px;font-size:15px;font-weight:700}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month button{background:var(--chip);border:0;color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px}
.month .name{font-weight:600;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bal-label{color:var(--mute);font-size:13px}
.bal{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.row2{display:flex;gap:12px}
.row2>div{flex:1;background:var(--chip);border-radius:12px;padding:10px 12px}
.row2 .l{font-size:12px;color:var(--mute)}
.row2 .v{font-weight:600;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:13px;color:var(--mute);font-weight:700;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.cat{margin-bottom:10px}
.cat .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.cat .sub{font-size:12px;color:var(--mute);margin-top:3px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--exp)}
.bar i.d{background:var(--pd)}.bar i.a{background:var(--pa)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.d{background:var(--pd)}.dot.a{background:var(--pa)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -4px 6px;padding-left:4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:13.5px}
.fchips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .m{flex:1;min-width:0;cursor:pointer}
.tx .c{font-weight:600;font-size:15px}
.tx .s{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:16px 0;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats>div{background:var(--chip);border-radius:12px;padding:10px 12px}
.stats .l{font-size:12px;color:var(--mute)}
.stats .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.trend{display:flex;align-items:flex-end;gap:8px;height:130px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.trend .bars{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.trend .bars i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:2px}
.trend .bars i.e{background:var(--exp)}.trend .bars i.n{background:var(--inc)}
.trend .lb{font-size:11.5px;color:var(--mute);margin-top:6px;text-transform:capitalize}
.legend{font-size:12px;color:var(--mute);margin-top:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{flex:1;min-width:140px;background:var(--chip);color:var(--ink);border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--acc);color:var(--acc-ink);border:0;border-radius:28px;height:56px;padding:0 22px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:10px;border-radius:9px;font-size:15px;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.lrow{display:flex;justify-content:space-between;align-items:center}
.lrow button{background:none;border:0;color:var(--acc);font-size:13px;font-weight:600;padding:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
input.amount{font-size:26px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips button.rm{border-color:var(--exp)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow button{flex:none;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:0 16px;font-weight:700}
.save{width:100%;margin-top:16px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700}
.save:disabled{opacity:.5}
.cancel{width:100%;margin-top:6px;background:none;border:0;color:var(--mute);padding:10px;font-size:15px}
.danger{width:100%;margin-top:2px;background:none;border:0;color:var(--exp);padding:10px;font-size:14px}
.note{background:var(--chip);border-radius:12px;padding:12px;font-size:14px;color:var(--mute);margin-bottom:12px}
textarea{height:46vh;font-size:13px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.logout{background:none;border:0;color:var(--mute);font-size:13px;padding:8px;margin:6px auto 0;display:block}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <h1>Семейный бюджет</h1>
  <div class="bal-label" style="margin-bottom:14px">Вход только для своих</div>
  <div class="seg" id="lwho">
    <button data-w="d" class="on">Даня</button>
    <button data-w="a">Аля</button>
  </div>
  <label for="pw">Пароль</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div id="lerr" class="note" style="margin-top:12px" hidden></div>
  <button class="save" id="lgo">Войти</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="tabs" id="tabs">
    <button data-tab="d">Даня</button>
    <button data-tab="a">Аля</button>
    <button data-tab="all">Общие</button>
  </div>
  <div id="status" class="note" hidden></div>

  <div class="month">
    <button id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="name" id="mname"></div>
    <button id="next" aria-label="Следующий месяц">›</button>
  </div>

  <div class="card">
    <div class="bal-label" id="balLabel">Остаток за месяц</div>
    <div class="bal" id="bal">0 ₸</div>
    <div class="row2">
      <div><div class="l">Доходы</div><div class="v inc" id="inc">0 ₸</div></div>
      <div><div class="l">Расходы</div><div class="v exp" id="exp">0 ₸</div></div>
    </div>
  </div>

  <div class="card" id="splitCard" hidden>
    <h2>Даня и Аля</h2>
    <div id="split"></div>
  </div>

  <div class="card">
    <h2>Расходы по категориям</h2>
    <div id="cats"></div>
  </div>

  <div class="card" id="statsCard" hidden>
    <h2>Статистика покупок</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card" id="topCard" hidden>
    <h2>Самые крупные покупки</h2>
    <div id="top"></div>
  </div>

  <div class="card">
    <h2>Расходы и доходы за 6 месяцев</h2>
    <div class="trend" id="trend"></div>
    <div class="legend"><span class="dot" style="background:var(--exp)"></span>расходы &nbsp; <span class="dot" style="background:var(--inc)"></span>доходы</div>
  </div>

  <div class="card">
    <h2 id="listTitle">Операции</h2>
    <div class="fchips" id="whoChips" hidden></div>
    <div class="fchips" id="catChips"></div>
    <div id="list"></div>
    <div class="btns" id="exportBtns" hidden>
      <button class="btn" id="csvMonth">Выписка за месяц (CSV)</button>
      <button class="btn" id="csvAll">Вся история (CSV)</button>
      <button class="btn" id="copyTxt">Скопировать текстом</button>
    </div>
  </div>
  <button class="logout" id="logout">Выйти</button>
</div>
<button class="fab" id="add" hidden>＋ Добавить</button>

<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog" aria-label="Операция">
    <div class="seg" id="segWho">
      <button data-w="d">Даня</button>
      <button data-w="a">Аля</button>
    </div>
    <div class="seg" id="segType">
      <button data-t="expense">Расход</button>
      <button data-t="income">Доход</button>
    </div>
    <label for="amt">Сумма, ₸</label>
    <input id="amt" class="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <div class="lrow"><label style="margin:10px 0 4px">Категория</label><button id="editCats">Изменить список</button></div>
    <div class="chips" id="chips"></div>
    <div class="addrow" id="addRow" hidden>
      <input id="newCat" type="text" maxlength="24" placeholder="Новая категория" autocomplete="off">
      <button id="addCatBtn">Добавить</button>
    </div>
    <label for="nt">Заметка</label>
    <input id="nt" type="text" placeholder="Необязательно" maxlength="80" autocomplete="off">
    <label for="dt">Дата</label>
    <input id="dt" type="date">
    <button class="save" id="save">Сохранить</button>
    <button class="danger" id="delBtn" hidden>Удалить операцию</button>
    <button class="cancel" id="cancel">Отмена</button>
  </div>
</div>

<div class="sheet-bg" id="txtBg">
  <div class="sheet">
    <label>Выписка: выдели весь текст и скопируй</label>
    <textarea id="txtOut" readonly></textarea>
    <button class="cancel" id="txtClose">Закрыть</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SB_URL="https://oegibvggbtgkucwndrjf.supabase.co";
  var SB_KEY="sb_publishable_iGMEHTc4hCAOWwZEXk82Ew_Ib883zLN";
  var EMAIL={d:"danya@family.local",a:"alya@family.local"};
  var PEOPLE={d:"Даня",a:"Аля"};
  var DEF={
    expense:["Продукты","Кафе","Транспорт","Жильё","Здоровье","Одежда","Развлечения","Подарки","Подписки","Прочее"],
    income:["Зарплата","Подработка","Мероприятия","Прочее"]
  };
  var cats={expense:DEF.expense.slice(),income:DEF.income.slice()};
  var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var MSHORT=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  var $=function(id){return document.getElementById(id)};
  var txs=[];
  var now=new Date();
  var cur={y:now.getFullYear(),m:now.getMonth()};
  var tab="d",me=null;
  var fCat=null,fWho=null;
  var form={type:"expense",who:"d",cat:null,editId:null,editTs:null,editing:false};
  var sb=window.supabase.createClient(SB_URL,SB_KEY);

  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var st=lsGet("bt_tab");if(st==="d"||st==="a"||st==="all")tab=st;

  function pad(n){return String(n).padStart(2,"0")}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function fmt(n){return Math.round(n).toLocaleString("ru-RU").replace(/ /g," ")+" ₸"}
  function mkey(y,m){return y+"-"+pad(m+1)}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function dm(s){var d=(s||"").split("-");return d[2]?d[2]+"."+d[1]:""}
  function stamp(ts){if(!ts)return "";var d=new Date(Number(ts));return pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
  function whoName(w){return PEOPLE[w]||"—"}
  function setStatus(msg){var s=$("status");if(msg){s.textContent=msg;s.hidden=false}else s.hidden=true}
  function amt(t){return Number(t.amount)||0}

  function scope(){return tab==="all"?txs:txs.filter(function(t){return t.who===tab})}
  function inMonth(list,y,m){var k=mkey(y,m);return list.filter(function(t){return (t.date||"").slice(0,7)===k})}
  function sortDesc(list){return list.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0)})}
  function renderTabs(){Array.prototype.forEach.call($("tabs").children,function(b){b.classList.toggle("on",b.getAttribute("data-tab")===tab)})}
  function totals(list){var inc=0,exp=0;list.forEach(function(t){if(t.type==="income")inc+=amt(t);else exp+=amt(t)});return {inc:inc,exp:exp}}

  function render(){
    renderTabs();
    $("mname").textContent=MONTHS[cur.m]+" "+cur.y;
    var isAll=tab==="all";
    var base=inMonth(scope(),cur.y,cur.m);
    var T=totals(base);
    var bal=T.inc-T.exp;
    $("balLabel").textContent=isAll?"Общий остаток за месяц":"Остаток за месяц: "+PEOPLE[tab];
    var b=$("bal");b.textContent=(bal>0?"+":"")+fmt(bal);b.className="bal "+(bal<0?"exp":"");
    $("inc").textContent=fmt(T.inc);$("exp").textContent=fmt(T.exp);
    $("splitCard").hidden=!isAll;$("statsCard").hidden=!isAll;$("topCard").hidden=!isAll;
    $("whoChips").hidden=!isAll;$("exportBtns").hidden=!isAll;
    $("listTitle").textContent=isAll?"Выписка — все операции":"Операции";
    if(isAll){renderSplit(base,T);renderStats(base,T);renderTop(base)}
    renderCats(base,T,isAll);renderTrend();renderFilters(base,isAll);renderList(base);
  }

  function renderSplit(base,T){
    var box=$("split");box.textContent="";
    ["d","a"].forEach(function(w){
      var mine=base.filter(function(t){return t.who===w});
      var X=totals(mine);
      var r=el("div","cat");var top=el("div","top");
      var nm=el("span");nm.appendChild(el("span","dot "+w));nm.appendChild(document.createTextNode(PEOPLE[w]));
      top.appendChild(nm);top.appendChild(el("span",null,"расходы "+fmt(X.exp)));
      var bar=el("div","bar");var i=el("i",w);i.style.width=(T.exp?X.exp/T.exp*100:0)+"%";bar.appendChild(i);
      r.appendChild(top);r.appendChild(bar);
      r.appendChild(el("div","sub","доходы "+fmt(X.inc)+" · "+(T.exp?Math.round(X.exp/T.exp*100):0)+"% общих расходов · операций: "+mine.length));
      box.appendChild(r);
    });
  }

  function renderCats(base,T,isAll){
    var byCat={};
    base.forEach(function(t){
      if(t.type==="income")return;
      var o=byCat[t.cat]||(byCat[t.cat]={d:0,a:0,sum:0});
      var a=amt(t);o.sum+=a;if(t.who==="d")o.d+=a;else if(t.who==="a")o.a+=a;
    });
    var box=$("cats");box.textContent="";
    var keys=Object.keys(byCat).sort(function(x,y){return byCat[y].sum-byCat[x].sum});
    if(!keys.length)box.appendChild(el("div","empty","Пока нет расходов"));
    keys.forEach(function(c){
      var o=byCat[c];
      var r=el("div","cat");var top=el("div","top");
      top.appendChild(el("span",null,c));
      top.appendChild(el("span",null,fmt(o.sum)+" · "+Math.round(o.sum/T.exp*100)+"%"));
      var bar=el("div","bar");bar.style.width=(o.sum/byCat[keys[0]].sum*100)+"%";
      if(isAll){[["d",o.d],["a",o.a]].forEach(function(p){if(p[1]){var i=el("i",p[0]);i.style.width=(p[1]/o.sum*100)+"%";bar.appendChild(i)}})}
      else{var i2=el("i");i2.style.width="100%";bar.appendChild(i2)}
      r.appendChild(top);r.appendChild(bar);
      if(isAll)r.appendChild(el("div","sub","Даня "+fmt(o.d)+" · Аля "+fmt(o.a)));
      box.appendChild(r);
    });
  }

  function renderStats(base,T){
    var ex=base.filter(function(t){return t.type!=="income"});
    var n=ex.length;
    var days=(cur.y===now.getFullYear()&&cur.m===now.getMonth())?now.getDate():new Date(cur.y,cur.m+1,0).getDate();
    var biggest=ex.slice().sort(function(a,b){return amt(b)-amt(a)})[0];
    var freq={};ex.forEach(function(t){freq[t.cat]=(freq[t.cat]||0)+1});
    var fk=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]})[0];
    var items=[
      ["Покупок за месяц",String(n)],
      ["Средний чек",n?fmt(T.exp/n):"—"],
      ["Трат в день",days?fmt(T.exp/days):"—"],
      ["Самая крупная",biggest?fmt(amt(biggest))+" · "+biggest.cat:"—"],
      ["Чаще всего",fk?fk+" ("+freq[fk]+")":"—"],
      ["Накопилось",T.inc?Math.round((T.inc-T.exp)/T.inc*100)+"% от доходов":"—"]
    ];
    var box=$("stats");box.textContent="";
    items.forEach(function(it){var d=el("div");d.appendChild(el("div","l",it[0]));d.appendChild(el("div","v",it[1]));box.appendChild(d)});
  }

  function renderTop(base){
    var ex=base.filter(function(t){return t.type!=="income"}).sort(function(a,b){return amt(b)-amt(a)}).slice(0,5);
    var box=$("top");box.textContent="";
    if(!ex.length)box.appendChild(el("div","empty","Покупок пока нет"));
    ex.forEach(function(t){box.appendChild(rowFor(t,true))});
  }

  function renderTrend(){
    var list=scope();var cols=[];
    for(var k=5;k>=0;k--){
      var d=new Date(cur.y,cur.m-k,1);
      var T=totals(inMonth(list,d.getFullYear(),d.getMonth()));
      cols.push({lb:MSHORT[d.getMonth()],e:T.exp,n:T.inc});
    }
    var max=Math.max.apply(null,cols.map(function(c){return Math.max(c.e,c.n)}).concat([1]));
    var box=$("trend");box.textContent="";
    cols.forEach(function(c){
      var col=el("div","col");var bars=el("div","bars");
      var e=el("i","e");e.style.height=(c.e/max*100)+"%";
      var n=el("i","n");n.style.height=(c.n/max*100)+"%";
      bars.appendChild(e);bars.appendChild(n);col.appendChild(bars);col.appendChild(el("div","lb",c.lb));
      box.appendChild(col);
    });
  }

  function renderFilters(base,isAll){
    if(isAll){
      var w=$("whoChips");w.textContent="";
      [[null,"Все"],["d","Даня"],["a","Аля"]].forEach(function(p){
        var b=el("button",fWho===p[0]?"on":"",p[1]);b.onclick=function(){fWho=p[0];render()};w.appendChild(b);
      });
    }else fWho=null;
    var present={};base.forEach(function(t){if(t.cat)present[t.cat]=1});
    if(fCat&&!present[fCat])fCat=null;
    var c=$("catChips");c.textContent="";
    var all=el("button",!fCat?"on":"","Все категории");all.onclick=function(){fCat=null;render()};c.appendChild(all);
    Object.keys(present).sort().forEach(function(name){
      var b=el("button",fCat===name?"on":"",name);b.onclick=function(){fCat=(fCat===name?null:name);render()};c.appendChild(b);
    });
  }

  function filtered(base){
    return sortDesc(base.filter(function(t){
      if(fCat&&t.cat!==fCat)return false;
      if(tab==="all"&&fWho&&t.who!==fWho)return false;
      return true;
    }));
  }

  function rowFor(t,compact){
    var row=el("div","tx");var m=el("div","m");
    m.appendChild(el("div","c",t.cat||"—"));
    var sub=dm(t.date)+" · "+whoName(t.who)+(t.note?" · "+t.note:"");
    if(!compact&&t.ts)sub+=" · внесено "+stamp(t.ts)+(t.editedTs?" (изм. "+stamp(t.editedTs)+")":"");
    m.appendChild(el("div","s",sub));
    m.onclick=function(){openSheet(t)};
    row.appendChild(m);
    row.appendChild(el("div","a "+(t.type==="income"?"inc":""),(t.type==="income"?"+":"−")+fmt(amt(t))));
    return row;
  }

  function renderList(base){
    var l=$("list");l.textContent="";
    var list=filtered(base);
    if(!list.length)l.appendChild(el("div","empty","Операций нет"));
    list.forEach(function(t){l.appendChild(rowFor(t,false))});
  }

  /* ---------- data (Supabase) ---------- */
  function mapRow(r){return {id:r.id,type:r.type,amount:Number(r.amount),cat:r.cat,note:r.note,date:r.date,who:r.who,ts:r.ts==null?null:Number(r.ts),editedTs:r.edited_ts==null?null:Number(r.edited_ts)}}
  function loadAll(){
    return Promise.all([
      sb.from("tx").select("*").order("date",{ascending:false}).limit(10000),
      sb.from("cats").select("*")
    ]).then(function(res){
      if(res[0].error){setStatus("Не удалось загрузить операции.");return}
      txs=(res[0].data||[]).map(mapRow);
      (res[1].data||[]).forEach(function(c){
        if((c.kind==="expense"||c.kind==="income")&&Array.isArray(c.items)&&c.items.length)cats[c.kind]=c.items.slice();
      });
      setStatus("");
      if(!$("bg").classList.contains("open"))render();
    }).catch(function(){setStatus("Нет связи. Данные обновятся, когда появится интернет.")});
  }
  function saveCats(){
    sb.from("cats").upsert([{kind:"expense",items:cats.expense},{kind:"income",items:cats.income}]).then(function(r){
      if(r.error)setStatus("Не удалось сохранить список категорий.");
    });
  }

  /* ---------- sheet ---------- */
  function drawSheet(){
    Array.prototype.forEach.call($("segWho").children,function(b){b.classList.toggle("on",b.getAttribute("data-w")===form.who)});
    Array.prototype.forEach.call($("segType").children,function(b){b.classList.toggle("on",b.getAttribute("data-t")===form.type)});
    var c=$("chips");c.textContent="";
    var list=cats[form.type];
    if(form.cat&&list.indexOf(form.cat)<0)list=list.concat([form.cat]);
    list.forEach(function(name){
      var b=el("button",form.editing?"rm":(form.cat===name?"on":""),form.editing?name+" ✕":name);
      b.onclick=function(){
        if(form.editing){
          cats[form.type]=cats[form.type].filter(function(x){return x!==name});
          if(!cats[form.type].length)cats[form.type]=["Прочее"];
          if(form.cat===name)form.cat=null;
          saveCats();drawSheet();
        }else{form.cat=name;drawSheet()}
      };
      c.appendChild(b);
    });
    $("editCats").textContent=form.editing?"Готово":"Изменить список";
    $("addRow").hidden=!form.editing;
  }
  function openSheet(t){
    form.editing=false;
    if(t){
      form.editId=t.id;form.editTs=t.ts||null;form.type=t.type==="income"?"income":"expense";
      form.who=PEOPLE[t.who]?t.who:"d";form.cat=t.cat||null;
      $("amt").value=String(amt(t)).replace(".",",");$("nt").value=t.note||"";$("dt").value=t.date||ymd(new Date());
      $("delBtn").hidden=false;
    }else{
      form.editId=null;form.editTs=null;form.type="expense";
      form.who=(tab==="d"||tab==="a")?tab:(me||"d");
      form.cat=null;$("amt").value="";$("nt").value="";$("dt").value=ymd(new Date());
      $("delBtn").hidden=true;
    }
    drawSheet();$("bg").classList.add("open");
    if(!t)setTimeout(function(){$("amt").focus()},50);
  }
  function closeSheet(){$("bg").classList.remove("open")}

  $("segWho").addEventListener("click",function(e){var w=e.target.getAttribute("data-w");if(!w)return;form.who=w;drawSheet()});
  $("segType").addEventListener("click",function(e){var t=e.target.getAttribute("data-t");if(!t)return;form.type=t;form.cat=null;drawSheet()});
  $("editCats").onclick=function(){form.editing=!form.editing;drawSheet();if(form.editing)setTimeout(function(){$("newCat").focus()},30)};
  $("addCatBtn").onclick=function(){
    var v=$("newCat").value.trim();if(!v)return;
    if(cats[form.type].indexOf(v)<0){cats[form.type].push(v);saveCats()}
    $("newCat").value="";form.cat=v;drawSheet();
  };
  $("newCat").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("addCatBtn").click()}});
  $("add").onclick=function(){openSheet(null)};
  $("cancel").onclick=closeSheet;
  $("bg").addEventListener("click",function(e){if(e.target===$("bg"))closeSheet()});

  $("save").onclick=function(){
    var amount=parseFloat(String($("amt").value).replace(/\s/g,"").replace(",","."));
    if(!amount||amount<=0){$("amt").focus();return}
    var id=form.editId||("t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var rec={id:id,type:form.type,amount:amount,cat:form.cat||"Прочее",note:$("nt").value.trim(),date:$("dt").value||ymd(new Date()),who:form.who,ts:form.editTs||Date.now()};
    if(form.editId)rec.edited_ts=Date.now();
    $("save").disabled=true;
    sb.from("tx").upsert(rec).then(function(r){
      $("save").disabled=false;
      if(r.error){setStatus("Не удалось сохранить: "+r.error.message);closeSheet();return}
      var d=rec.date.split("-");cur.y=+d[0];cur.m=+d[1]-1;
      if(tab!=="all"&&tab!==rec.who){tab=rec.who;lsSet("bt_tab",tab)}
      closeSheet();loadAll().then(render);
    },function(){$("save").disabled=false;setStatus("Нет связи, операция не сохранена.")});
  };
  var delArm=false;
  $("delBtn").onclick=function(){
    var b=$("delBtn");
    if(!delArm){delArm=true;b.textContent="Точно удалить? Нажми ещё раз";setTimeout(function(){delArm=false;b.textContent="Удалить операцию"},3000);return}
    delArm=false;b.textContent="Удалить операцию";
    if(!form.editId)return;
    sb.from("tx").delete().eq("id",form.editId).then(function(r){
      if(r.error)setStatus("Не удалось удалить: "+r.error.message);
      closeSheet();loadAll().then(render);
    });
  };

  $("tabs").addEventListener("click",function(e){
    var t=e.target.getAttribute("data-tab");if(!t)return;
    tab=t;fCat=null;fWho=null;lsSet("bt_tab",t);render();
  });
  $("prev").onclick=function(){cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()};
  $("next").onclick=function(){cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()};

  /* ---------- export ---------- */
  function csvCell(v){
    var s=String(v==null?"":v);
    if(/^[=+\-@\t\r]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  }
  function sortAsc(list){return list.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")||(a.ts||0)-(b.ts||0)})}
  function buildCsv(list){
    var rows=[["Дата","Кто","Тип","Категория","Сумма","Заметка","Внесено","Изменено"]];
    sortAsc(list).forEach(function(t){
      rows.push([t.date||"",whoName(t.who),t.type==="income"?"Доход":"Расход",t.cat||"",String(amt(t)).replace(".",","),t.note||"",t.ts?stamp(t.ts):"",t.editedTs?stamp(t.editedTs):""]);
    });
    return "﻿"+rows.map(function(r){return r.map(csvCell).join(";")}).join("\r\n");
  }
  function saveCsv(name,list){
    if(!list.length){setStatus("Нет операций для выписки.");return}
    try{
      var blob=new Blob([buildCsv(list)],{type:"text/csv;charset=utf-8"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    }catch(e){showText(buildText(list,name))}
  }
  function buildText(list,title){
    var T=totals(list);
    var lines=["Выписка: "+title.replace(/\.csv$/,"")];
    sortAsc(list).forEach(function(t){
      lines.push(dm(t.date)+" | "+whoName(t.who)+" | "+(t.cat||"")+" | "+(t.type==="income"?"+":"−")+fmt(amt(t))+(t.note?" | "+t.note:""));
    });
    lines.push("Итого доходы: "+fmt(T.inc)+", расходы: "+fmt(T.exp)+", остаток: "+fmt(T.inc-T.exp));
    return lines.join("\n");
  }
  function showText(s){$("txtOut").value=s;$("txtBg").classList.add("open")}
  $("txtClose").onclick=function(){$("txtBg").classList.remove("open")};
  $("csvMonth").onclick=function(){saveCsv("vypiska-"+mkey(cur.y,cur.m)+".csv",inMonth(txs,cur.y,cur.m))};
  $("csvAll").onclick=function(){saveCsv("vypiska-vse.csv",txs)};
  $("copyTxt").onclick=function(){
    var list=inMonth(txs,cur.y,cur.m);
    if(!list.length){setStatus("Нет операций для выписки.");return}
    var s=buildText(list,"vypiska-"+mkey(cur.y,cur.m));
    try{navigator.clipboard.writeText(s).then(function(){setStatus("Выписка скопирована.");setTimeout(function(){setStatus("")},2500)}).catch(function(){showText(s)})}
    catch(e){showText(s)}
  };

  /* ---------- login / session ---------- */
  var lwho="d";
  $("lwho").addEventListener("click",function(e){
    var w=e.target.getAttribute("data-w");if(!w)return;lwho=w;
    Array.prototype.forEach.call($("lwho").children,function(b){b.classList.toggle("on",b.getAttribute("data-w")===w)});
  });
  function lerr(m){var n=$("lerr");n.textContent=m||"";n.hidden=!m}
  function doLogin(){
    var pw=$("pw").value;if(!pw)return;
    $("lgo").disabled=true;lerr("");
    sb.auth.signInWithPassword({email:EMAIL[lwho],password:pw}).then(function(r){
      $("lgo").disabled=false;
      if(r.error){lerr("Неверный пароль или нет связи.");return}
      $("pw").value="";start();
    },function(){$("lgo").disabled=false;lerr("Нет связи.")});
  }
  $("lgo").onclick=doLogin;
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
  $("logout").onclick=function(){sb.auth.signOut().then(function(){location.reload()})};

  var timer=null;
  function showApp(on){
    $("app").hidden=!on;$("add").hidden=!on;$("login").hidden=on;
  }
  function start(){
    sb.from("members").select("who").maybeSingle().then(function(r){
      if(r.error||!r.data){sb.auth.signOut();showApp(false);lerr("У этого входа нет доступа.");return}
      me=r.data.who;
      if(!lsGet("bt_tab"))tab=me;
      showApp(true);render();
      loadAll();
      if(timer)clearInterval(timer);
      timer=setInterval(function(){if(!document.hidden&&!$("bg").classList.contains("open"))loadAll()},20000);
    });
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&me&&!$("bg").classList.contains("open"))loadAll()});

  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session)start();else showApp(false);
  });
})();
</script>
</body>
</html>
